{% extends "layout.html" %}

{% block main%}
    <div class="container pt-3 full-height">

        <div class="card text-white bg-dark admin-panel">
            <div class="card-header bg-dark admin-panel-header">
                <h2>Admin Panel</h2>
            </div>

            <div class="card text-white bg-dark">
                <div class="card-body">
                    <h5 id="last-update">Last episodes database update:</h5>
                    <button id="force-update" class="btn btn-primary">Force Update</button>
                </div>
            </div>
            <div class="card text-white bg-dark">
            <!-- Navigation panel -->
                <div class="card-header bg-dark admin-list-header">
                    <ul class="nav nav-tabs" id="adminTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="podcasts-tab" data-bs-toggle="tab" data-bs-target="#podcasts" type="button" role="tab" aria-controls="podcasts" aria-selected="true">Podcasts list</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="users-tab" data-bs-toggle="tab" data-bs-target="#users" type="button" role="tab" aria-controls="users" aria-selected="false">Users list</button>
                        </li>
                    </div>

                    <div class="card-body">
                        <div class="tab-content" id="adminTabContent">
                            <div class="tab-pane fade show active" id="podcasts" role="tabpanel" aria-labelledby="podcasts-tab">
                                <form class="row my-2" action="/add_podcast" method="post">
                                    <div class="card text-white bg-dark">
                                        <div class="card-header">
                                            <h2>Add new podcast:</h2>
                                        </div>
                                        <div class="card-body">
                                            <div class="col-md-10 input-group">
                                                <label for="rssink" class="input-group-text">RSS url:</label>
                                                <input class="form-control" id="rssLink" name="rss_url" type="text" placeholder="https://www.example.com/rss.xml">
                                                <button class="btn btn-primary" type="submit">Add</button>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                                <div class="row my-2">
                                    <div class="card text-white bg-dark">
                                        <div class="card-header">
                                            <h2>Podcasts List:</h2>
                                        </div>
                                        <div class="card-body">
                                            <ul class="list-group" id="podcasts-list">
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="tab-pane fade" id="users" role="tabpanel" aria-labelledby="users-tab">
                                <div class="row my-2">
                                    <div class="card text-white bg-dark">
                                        <div class="card-header">
                                            <h2>Users List:</h2>
                                        </div>
                                        <div class="card-body">
                                            <table class="table text-white">
                                                <thead>
                                                    <tr>
                                                        <th scope="col">Id</th>
                                                        <th scope="col">Name</th>
                                                        <th scope="col">Change Role</th>
                                                        <th scope="col"> Registered on:</th>
                                                        <th scope="col">Remove</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="admin-user-list">
                                                    <tr>
                                                        <th scope="row">0</th>
                                                        <td>Test</td>
                                                        <td><input type="checkbox"></td>
                                                        <td>Date</td>
                                                        <td><button>del</button></td>
                                                    </tr>
                                                    <tr>
                                                        <th scope="row">1</th>
                                                        <td>Test</td>
                                                        <td><input type="checkbox"></td>
                                                        <td>Date</td>
                                                        <td><button><i class="fa fa-user-times" aria-hidden="true"></i></button></td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>
            </div>
            <script src="./static/admin-tools.js"></script>
        </div>
{% endblock %}
